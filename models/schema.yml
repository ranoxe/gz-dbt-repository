version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: "Raw data from Greenweez e-commerce platform"
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "Sales of Greenweez - we have one row per product_id found in each orders_id"
      # Freshness testing - make sure to fill in the ...
        loaded_at_field: "CAST(date_date AS TIMESTAMP)"
        freshness:
           warn_after: {count: 90,period: day }
        columns:
          - name: date_date
            description: "Date of purchase"
          - name: orders_id
            description: "Unique identifier of the order"
            tests :
             - not_null
          - name: pdt_id
            description: "Unique identifier of the product"
          - name: revenue
            description: "Total revenue of the order line"
          - name: quantity
            description: "Number of products purchased"
            
      - name: product
        identifier: raw_gz_product
        description: "Products of Greenweez"
        columns:
          - name: products_id
            description: "Unique identifier of the product (primary key)"
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: "Purchase price of the product"
            
      - name: ship
        identifier: raw_gz_ship
        description: "Shipping information for Greenweez orders"
        columns:
          - name: orders_id
            description: "Unique identifier of the order (primary key)"
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: "Fee charged to customer for shipping"
          - name: logcost
            description: "Logistic cost of shipping"
          - name: ship_cost
            description: "Actual shipping cost"